[package]
name = "bifrost_core"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
libp2p = "0.56.0"
ndarray = "0.17.2"
ndarray-rand = "0.16.0"
rand = "0.10.1"
rand_distr = "0.6.0"
rayon = "1.12.0"
serde_json = "1.0.150"
tonic = "0.12.3"
prost = "0.13.3"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1.15", features = ["net"] }
serde = { version = "1.0", features = ["derive"] }


[build-dependencies]
tonic-build = "0.12.3"
